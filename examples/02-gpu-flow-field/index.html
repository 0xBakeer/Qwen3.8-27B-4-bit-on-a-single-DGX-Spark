<!DOCTYPE html>
<!--
  GPU Curl-Noise Flow Field
  -----------------------------------------------------------------------
  Target: three.js r170 (WebGL2), loaded via an ES-module import map from a
  CDN. No build step, no bundler, no local deps, no external assets. Open
  this file directly in a browser.

  WHAT KEEPS IT FAST
  - ALL particle motion is computed in the VERTEX SHADER. The CPU never
    touches per-particle state: no ping-pong FBO, no transform feedback, no
    per-frame buffer upload. Each particle's position is a pure function of
    its seed + the single uTime uniform (stateless advection via a few Euler
    sub-steps through the curl field).
  - The 200,000 particles are ONE THREE.Points object -> ONE draw call.
  - The noise + curl are analytic GLSL (no textures to sample).
  - Additive blending with depth write/test disabled -> cheap overdraw, no
    z-buffer traffic.
  - Device pixel ratio is capped at 2 to bound fill-rate on hi-dpi screens.
  - STEPS (advection sub-steps per particle) is the main performance knob;
    lower it if you need more headroom on weak GPUs.
  -----------------------------------------------------------------------
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GPU Curl-Noise Flow Field</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
  #c { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cdd6e4; width: 244px;
    background: rgba(10, 14, 22, 0.62);
    border: 1px solid rgba(120, 150, 190, 0.18);
    border-radius: 12px; padding: 14px 15px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    user-select: none;
  }
  #ui.hidden { display: none; }
  #ui .title { display: flex; align-items: center; gap: 8px; font-weight: 600;
    letter-spacing: .2px; color: #eef3fb; margin-bottom: 12px; }
  #ui .dot { width: 8px; height: 8px; border-radius: 50%;
    background: #4ea1ff; box-shadow: 0 0 10px #4ea1ff; }
  #ui .row { display: grid; grid-template-columns: 86px 1fr 44px;
    align-items: center; gap: 8px; margin: 9px 0; }
  #ui label { color: #93a3b8; }
  #ui .val { color: #7fd4ff; text-align: right; font-variant-numeric: tabular-nums; }
  #ui input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    border-radius: 3px; background: rgba(120,150,190,0.28); outline: none;
  }
  #ui input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: #4ea1ff; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(78,161,255,0.18);
  }
  #ui input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border: none; border-radius: 50%;
    background: #4ea1ff; cursor: pointer;
  }
  #ui .hint { margin-top: 12px; color: #5f7189; font-size: 11px; line-height: 1.5; }

  #fps {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #7fd4ff; padding: 8px 11px;
    background: rgba(10,14,22,0.55); border: 1px solid rgba(120,150,190,0.16);
    border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
    color: #ff9d9d; font: 14px/1.5 ui-monospace, monospace; text-align: center; padding: 20px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <div class="title"><span class="dot"></span> GPU Curl-Noise Flow Field</div>
    <div class="row"><label>Noise scale</label><input id="scale" type="range" min="0.04" max="0.50" step="0.005" value="0.16"><span class="val" id="scaleVal">0.16</span></div>
    <div class="row"><label>Flow speed</label><input id="speed" type="range" min="0.00" max="2.00" step="0.01" value="0.70"><span class="val" id="speedVal">0.70</span></div>
    <div class="row"><label>Lifetime</label><input id="life"  type="range" min="2.0"  max="15.0" step="0.1"  value="6.0"><span class="val" id="lifeVal">6.0s</span></div>
    <div class="hint">move the cursor to push the field away<br>press <b>H</b> to hide this panel</div>
  </div>
  <div id="fps">-- fps</div>
  <div id="err"></div>

<script type="module">
import * as THREE from 'three';

// ------------------------------------------------------------------
// GLSL. Written in GLSL1 style (attribute / varying / gl_FragColor);
// three r170 auto-transpiles these to GLSL ES 3.0 on WebGL2.
// ------------------------------------------------------------------

const vertexShader = /* glsl */`
uniform float uTime;
uniform float uLife;
uniform float uSpeed;
uniform float uNoiseScale;
uniform vec3  uMouse;
uniform float uMouseStrength;
uniform float uPointScale;
uniform float uMaxSpeed;
uniform float uRadius;

attribute vec3 aRandom;   // per-particle randoms in [0,1)^3

varying float vSpeed;     // normalised flow speed -> drives the colour
varying float vFade;      // life fade-in/out -> hides the respawn

// ---- hashing ------------------------------------------------------
vec3 hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}

// ---- 3D simplex noise, written inline (Ashima / Ian McEwan) -------
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
float mod289(float x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }

float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g  = step(x0.yzx, x0.xyz);
  vec3 l  = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))
                   + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                   + i.x + vec4(0.0, 1.0, 2.0, 3.0);
  float n_ = 0.142857142857;
  vec3  ns = n_ * D.wyz - D.xzx;
  vec4  j  = p - 49.0 * floor(p * ns.z * ns.z);
  vec4  x_ = floor(j * ns.z);
  vec4  y_ = floor(j - 7.0 * x_);
  vec4  x  = x_ * ns.x + ns.yyyy;
  vec4  y  = y_ * ns.x + ns.yyyy;
  vec4  h  = 1.0 - abs(x) - abs(y);
  vec4  b0 = vec4(x.xy, y.xy);
  vec4  b1 = vec4(x.zw, y.zw);
  vec4  s0 = floor(b0) * 2.0 + 1.0;
  vec4  s1 = floor(b1) * 2.0 + 1.0;
  vec4  sh = -step(h, vec4(0.0));
  vec4  a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4  a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3  p0 = vec3(a0.xy, h.x);
  vec3  p1 = vec3(a0.zw, h.y);
  vec3  p2 = vec3(a1.xy, h.z);
  vec3  p3 = vec3(a1.zw, h.w);
  vec4  norm = 1.79284291400159 - 0.5 * vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4  m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

// ---- divergence-free flow field ----------------------------------
// A 3-component vector potential built from 3 offset noise samples.
// velocity = curl(A). The curl is taken with forward finite differences;
// curl-of-a-potential is divergence-free by construction, so the field
// swirls and never collapses into sinks.
vec3 fieldTime(float t){
  // slow, non-translational evolution so the field keeps morphing
  return vec3(t * 0.050, t * 0.037, t * 0.061);
}
vec3 curlNoise(vec3 p, float t){
  float e  = 0.6;                       // finite-difference step (noise space)
  vec3  q  = p * uNoiseScale + fieldTime(t);
  vec3  c1 = vec3(0.0, 0.0, 0.0);
  vec3  c2 = vec3(31.7, 47.2, 12.9);
  vec3  c3 = vec3(93.4, 18.6, 61.3);

  // 9 samples: 3 base components + 6 forward-difference neighbours
  float ax0 = snoise(q + c1);                    // A.x at p
  float ay0 = snoise(q + c2);                    // A.y at p
  float az0 = snoise(q + c3);                    // A.z at p
  float axy = snoise(q + vec3(0.0, e, 0.0) + c1); // A.x at p+ey
  float azx = snoise(q + vec3(e, 0.0, 0.0) + c3); // A.z at p+ex
  float azy = snoise(q + vec3(0.0, e, 0.0) + c3); // A.z at p+ey
  float axz = snoise(q + vec3(0.0, 0.0, e) + c1); // A.x at p+ez
  float ayz = snoise(q + vec3(0.0, 0.0, e) + c2); // A.y at p+ez
  float ayx = snoise(q + vec3(e, 0.0, 0.0) + c2); // A.y at p+ex

  vec3 v;
  v.x = (azy - az0) / e - (ayz - ay0) / e;  // dAz/dy - dAy/dz
  v.y = (axz - ax0) / e - (azx - az0) / e;  // dAx/dz - dAz/dx
  v.z = (ayx - ay0) / e - (axy - ax0) / e;  // dAy/dx - dAx/dy
  return v * uSpeed;
}

// ---- spawn: a point in a (near-shell) ball of radius uRadius ------
vec3 spawnPos(vec3 r){
  float theta = r.x * 6.28318530718;
  float cphi  = r.y * 2.0 - 1.0;
  float sphi  = sqrt(max(0.0, 1.0 - cphi * cphi));
  vec3  dir   = vec3(sphi * cos(theta), cphi, sphi * sin(theta));
  float rad   = uRadius * mix(0.2, 1.0, pow(r.z, 0.5));
  return dir * rad;
}

void main(){
  float life     = uLife;
  float phase    = aRandom.z * life;        // desynchronise births
  float tt       = uTime + phase;
  float gen      = floor(tt / life);        // current life-cycle index
  float age      = mod(tt, life);           // time into this life, 0..life
  float progress = age / life;
  float birthT   = uTime - age;             // absolute time at birth

  // a fresh home every generation -> particles respawn at new positions
  vec3 seed = vec3(aRandom.x + gen * 0.1591,
                   aRandom.y + gen * 0.3141,
                   aRandom.z + gen * 0.7352);
  vec3 pos = spawnPos(hash13(seed));

  // advect through the curl field with a few midpoint-Euler sub-steps
  const int STEPS = 4;
  float dt   = age / float(STEPS);
  vec3  lastCurl = vec3(0.0);
  for (int i = 0; i < STEPS; i++){
    float ft = birthT + dt * (float(i) + 0.5);
    lastCurl = curlNoise(pos, ft);
    vec3 acc = lastCurl + (-pos * 0.045);   // gentle containment keeps the cloud framed
    pos += acc * dt;
  }

  // mouse repulsion: push particles away from the cursor's 3D point
  vec3  dm = pos - uMouse;
  float d2 = dot(dm, dm);
  pos += (dm / max(sqrt(d2), 0.001)) * uMouseStrength * 6.0 * exp(-d2 * 0.045);

  // colour from the (pre-containment) flow speed; faster reads hotter
  vSpeed = clamp(length(lastCurl) / uMaxSpeed, 0.0, 1.0);

  // fade in at birth / out at death so the respawn is invisible
  vFade = smoothstep(0.0, 0.12, progress) * smoothstep(1.0, 0.85, progress);

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(uPointScale / max(-mv.z, 0.1), 0.75, 40.0);
}
`;

const fragmentShader = /* glsl */`
varying float vSpeed;
varying float vFade;

// cool -> hot palette; fast particles read hotter
vec3 palette(float t){
  vec3 c0 = vec3(0.05, 0.12, 0.30);  // deep indigo (slow)
  vec3 c1 = vec3(0.10, 0.40, 0.85);  // blue
  vec3 c2 = vec3(0.15, 0.80, 0.95);  // cyan
  vec3 c3 = vec3(0.95, 0.85, 0.35);  // yellow
  vec3 c4 = vec3(1.00, 0.35, 0.12);  // orange-red (hot)
  vec3 col;
  if (t < 0.25)      col = mix(c0, c1, t / 0.25);
  else if (t < 0.5)  col = mix(c1, c2, (t - 0.25) / 0.25);
  else if (t < 0.75) col = mix(c2, c3, (t - 0.5) / 0.25);
  else               col = mix(c3, c4, (t - 0.75) / 0.25);
  return col;
}

void main(){
  vec2  uv = gl_PointCoord - 0.5;
  float d  = length(uv);
  if (d > 0.5) discard;                 // round sprite, drop the square corners
  float core = smoothstep(0.5, 0.0, d); // soft falloff toward the edge
  float glow = core * core;             // concentrate energy at the centre
  vec3  col  = palette(vSpeed) * glow * vFade;
  gl_FragColor = vec4(col, 1.0);        // additive blending does the rest
}
`;

// ---- full-screen background: subtle vertical gradient + vignette --
const bgVert = /* glsl */`
varying vec2 vUv;
void main(){
  vUv = (position.xy + 1.0) * 0.5;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;
const bgFrag = /* glsl */`
varying vec2 vUv;
uniform vec2 uRes;
void main(){
  vec2  p = vUv - 0.5;
  p.x *= uRes.x / max(uRes.y, 1.0);
  float d = length(p);
  vec3  top = vec3(0.050, 0.060, 0.110);
  vec3  bot = vec3(0.012, 0.016, 0.035);
  vec3  col = mix(bot, top, vUv.y);
  float vig = smoothstep(0.95, 0.25, d);       // darker toward the corners
  col *= mix(0.30, 1.0, vig);
  col += vec3(0.020, 0.035, 0.070) * smoothstep(0.45, 0.0, d); // centre glow
  gl_FragColor = vec4(col, 1.0);
}
`;

// ------------------------------------------------------------------
// Setup
// ------------------------------------------------------------------
const canvas = document.getElementById('c');
const errEl  = document.getElementById('err');

function fail(msg){
  errEl.style.display = 'grid';
  errEl.textContent = msg;
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  fail('WebGL2 is not available in this browser: ' + e.message);
  throw e;
}

// DPR capped at 2: more than that only costs fill-rate for almost no gain.
function dpr(){ return Math.min(window.devicePixelRatio || 1, 2); }

renderer.setPixelRatio(dpr());
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05060a, 1);
renderer.autoClear = false;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
const CAM_DIST = 15;
camera.position.set(0, 1.5, CAM_DIST);
camera.lookAt(0, 0, 0);

// ---- particles ----------------------------------------------------
const N = 200000;
const positions = new Float32Array(N * 3);      // unused by the shader, but
                                               // required for the draw count
const randoms   = new Float32Array(N * 3);
for (let i = 0; i < N * 3; i++) randoms[i] = Math.random();

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('aRandom',  new THREE.BufferAttribute(randoms, 3));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 100);

const uniforms = {
  uTime:         { value: 0 },
  uLife:         { value: 6.0 },
  uSpeed:        { value: 0.7 },
  uNoiseScale:   { value: 0.16 },
  uMouse:        { value: new THREE.Vector3(0, 0, -9999) },
  uMouseStrength:{ value: 0 },
  uPointScale:   { value: 30 },
  uMaxSpeed:     { value: 1.2 },
  uRadius:       { value: 6.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
});

const points = new THREE.Points(geo, mat);
points.frustumCulled = false;   // positions are computed in the shader
scene.add(points);

// ---- background quad (rendered first, screen-space) ---------------
const bgScene = new THREE.Scene();
const bgCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgGeo   = new THREE.BufferGeometry();
bgGeo.setAttribute('position',
  new THREE.BufferAttribute(new Float32Array([-1, -1, 0,  3, -1, 0,  -1, 3, 0]), 3));
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } },
  vertexShader: bgVert,
  fragmentShader: bgFrag,
  depthTest: false,
  depthWrite: false,
});
bgScene.add(new THREE.Mesh(bgGeo, bgMat));

// ------------------------------------------------------------------
// Interaction
// ------------------------------------------------------------------
const mouseNdc = new THREE.Vector2(0, 0);
const uMouseTarget = new THREE.Vector3(0, 0, -9999);
let lastMove = -1e9;

window.addEventListener('pointermove', (e) => {
  mouseNdc.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouseNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  lastMove = performance.now();
});

const fpsEl = document.getElementById('fps');
const uiEl  = document.getElementById('ui');

function bind(id, valId, apply, fmt){
  const el  = document.getElementById(id);
  const val = document.getElementById(valId);
  const f = () => { const x = parseFloat(el.value); apply(x); val.textContent = fmt(x); };
  el.addEventListener('input', f);
  f();
}
bind('scale', 'scaleVal', (x) => { uniforms.uNoiseScale.value = x; }, (x) => x.toFixed(2));
bind('speed', 'speedVal', (x) => { uniforms.uSpeed.value = x; },      (x) => x.toFixed(2));
bind('life',  'lifeVal',  (x) => { uniforms.uLife.value = x; },       (x) => x.toFixed(1) + 's');

window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') uiEl.classList.toggle('hidden');
});

// resize + device-pixel-ratio aware
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const d = dpr();
  renderer.setPixelRatio(d);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  bgMat.uniforms.uRes.value.set(w, h);
  // point size in device pixels at unit distance; scales with the screen
  uniforms.uPointScale.value = 30 * d * (Math.min(w, h) / 900);
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------
// Main loop
// ------------------------------------------------------------------
const clock = new THREE.Clock();
const _v = new THREE.Vector3();

// hand-rolled FPS: count frames over a 500ms window
let fFrames = 0, fLast = performance.now();

function tick(){
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;

  // slow autonomous orbit so the 3D structure is visible untouched
  const a = t * 0.06;
  camera.position.set(
    Math.cos(a) * CAM_DIST,
    Math.sin(t * 0.11) * 1.2 + 1.0,
    Math.sin(a) * CAM_DIST
  );
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();

  // cursor -> 3D point: walk |camera-to-origin| along the cursor ray, so the
  // screen centre maps to the field centre and the screen edge to ~field edge.
  // Strength ramps in/out with cursor activity.
  const active = (performance.now() - lastMove) < 800;
  uniforms.uMouseStrength.value += ((active ? 1 : 0) - uniforms.uMouseStrength.value) * 0.08;
  if (lastMove > 0){
    _v.set(mouseNdc.x, mouseNdc.y, 0.5).unproject(camera);
    _v.sub(camera.position).normalize();
    const dist = camera.position.length();
    uMouseTarget.copy(camera.position).addScaledVector(_v, dist);
    uniforms.uMouse.value.lerp(uMouseTarget, 0.15);
  }

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);

  // fps counter
  fFrames++;
  const now = performance.now();
  if (now - fLast >= 500){
    fpsEl.textContent = Math.round(fFrames * 1000 / (now - fLast)) + ' fps';
    fFrames = 0;
    fLast = now;
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
